name: Download YouTube & Upload to Ufile

on:
  issues:
    types: [opened]  # Triggered when a new issue is opened
  workflow_dispatch:  # Manual trigger from Actions tab
    inputs:
      url:
        description: 'YouTube video or playlist URL'
        required: true
        default: 'https://www.youtube.com/watch?v=...'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'youtube')
    env:
      MAX_PART_SIZE_MB: 2500   # Max size per part (2.5 GB)
      UFILE_API: 'https://upload.ufile.io/'   # Ufile upload API endpoint
      RECIPIENT_EMAIL: ${{ github.event.issue.user.email || github.actor }}@users.noreply.github.com

    steps:
      - name: Checkout repository (no upload to GitHub)
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip p7zip-full jq curl
          pip3 install yt-dlp

      - name: Extract YouTube URL from issue or input
        id: get_url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            URL="${{ github.event.inputs.url }}"
          else
            URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s]+' | head -1)
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "URL: $URL"

      - name: Download video(s) from YouTube and get metadata
        run: |
          mkdir -p downloads
          cd downloads

          URL="${{ steps.get_url.outputs.url }}"

          # Get playlist/video metadata (single JSON for playlist or video)
          yt-dlp --flat-playlist --dump-single-json "$URL" > info.json

          # Extract playlist title (if playlist) or video title
          PLAYLIST_TITLE=$(jq -r '.playlist_title // .title' info.json)
          echo "PLAYLIST_TITLE=$PLAYLIST_TITLE" >> $GITHUB_ENV

          # Download with custom output template: video title as filename
          yt-dlp -f bestvideo+bestaudio --merge-output-format mp4 \
                 --restrict-filenames -o "%(title)s.%(ext)s" \
                 --no-playlist-if-no-url "$URL"

          echo "Download completed."

      - name: Split large files into parts (max ${{ env.MAX_PART_SIZE_MB }} MB each)
        run: |
          cd downloads
          for file in *.mp4; do
            if [ -f "$file" ]; then
              SIZE_MB=$(du -m "$file" | cut -f1)
              BASENAME="${file%.*}"
              if [ $SIZE_MB -gt ${{ env.MAX_PART_SIZE_MB }} ]; then
                echo "File $file exceeds size limit, splitting..."
                7z a -v${{ env.MAX_PART_SIZE_MB }}m "${BASENAME}.7z" "$file"
                rm "$file"
              else
                echo "File $file is within limit, compressing with 7z..."
                7z a "${BASENAME}.7z" "$file"
                rm "$file"
              fi
            fi
          done
          # Now we have .7z and possibly .7z.001, .7z.002, etc.

      - name: Upload each part to Ufile.io and collect links
        id: upload
        run: |
          cd downloads
          > upload_info.txt   # clear file
          for archive in *.7z*; do
            if [ -f "$archive" ]; then
              echo "Uploading $archive ..."
              RESPONSE=$(curl -s -F "file=@$archive" ${{ env.UFILE_API }})
              LINK=$(echo "$RESPONSE" | jq -r '.data.url // empty')
              if [ -n "$LINK" ]; then
                echo "$archive: $LINK" >> upload_info.txt
                echo "✅ Uploaded: $LINK"
              else
                echo "❌ Failed to upload $archive"
                echo "Server response: $RESPONSE"
              fi
            fi
          done
          # Save the content for later use
          cat upload_info.txt

      - name: Prepare email body (in English)
        id: email_body
        run: |
          cd downloads
          # Get playlist title from env
          PLAYLIST_TITLE="${{ env.PLAYLIST_TITLE }}"
          if [ -z "$PLAYLIST_TITLE" ]; then
            PLAYLIST_TITLE="Unknown Title"
          fi

          # Count total files (parts)
          TOTAL_PARTS=$(wc -l < upload_info.txt)

          # Build email body
          BODY="Hello,\n\n"
          BODY+="Your YouTube download has been completed successfully.\n"
          BODY+="Playlist / Video: $PLAYLIST_TITLE\n"
          BODY+="Total parts uploaded: $TOTAL_PARTS\n\n"
          BODY+="Download links (each part is a separate file):\n\n"
          while IFS= read -r line; do
            BODY+="$line\n"
          done < upload_info.txt
          BODY+="\nThese links are valid for 30 days.\n\n"
          BODY+="Regards,\nYouTube Downloader Bot"

          # Write body to file for later use
          echo -e "$BODY" > email_body.txt
          # Also store as output for debug
          cat email_body.txt

      - name: Send email with download links (English)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '✅ YouTube Download: ${{ env.PLAYLIST_TITLE }}'
          to: ${{ env.RECIPIENT_EMAIL }}
          from: YouTube Downloader
          body: ${{ steps.email_body.outputs.body }}   # Not directly possible, we need to use file
          # Instead, we can use a file input
          # The action supports 'body_file' input to read from file
          body_file: downloads/email_body.txt

      - name: Clean up local files
        run: rm -rf downloads

      - name: Close the issue (if started from issue)
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            ✅ Download and upload completed successfully.
            Download links have been sent to your email address.

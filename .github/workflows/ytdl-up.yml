name: Download YouTube & Upload to Ufile

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video or playlist URL'
        required: true
        default: 'https://www.youtube.com/watch?v=...'
      quality:
        description: 'Video quality (best, 1080p, 720p, 480p, 360p, audio-only)'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080p
          - 720p
          - 480p
          - 360p
          - audio-only
      subtitles:
        description: 'Subtitles language (fa, en, both, none) - Soft subs (separate files)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - fa
          - en
          - both
      password:
        description: 'Password for 7z archive (leave empty for no password)'
        required: false
        default: ''
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'youtube')
    env:
      MAX_PART_SIZE_MB: 2500
      UFILE_API: 'https://upload.ufile.io/'
      RECIPIENT_EMAIL: ${{ github.event.issue.user.email || github.actor }}@users.noreply.github.com
      COOKIE_COUNT: 3  # ← تعداد کوکی‌هایی که دارید را وارد کنید
      # Secretهای کوکی را به محیط منتقل کنید
      YOUTUBE_COOKIE_1: ${{ secrets.YOUTUBE_COOKIE_1 }}
      YOUTUBE_COOKIE_2: ${{ secrets.YOUTUBE_COOKIE_2 }}
      YOUTUBE_COOKIE_3: ${{ secrets.YOUTUBE_COOKIE_3 }}
      # در صورت نیاز، تا ۱۰ یا ۲۰ عدد اضافه کنید

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip p7zip-full jq curl
          pip3 install yt-dlp

      - name: Extract parameters from issue (if triggered by issue)
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            URL="${{ github.event.inputs.url }}"
            QUALITY="${{ github.event.inputs.quality }}"
            SUBS="${{ github.event.inputs.subtitles }}"
            PASSWORD="${{ github.event.inputs.password }}"
          else
            BODY="${{ github.event.issue.body }}"
            # Extract URL
            URL=$(echo "$BODY" | grep -oP 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s]+' | head -1)
            # Extract quality (default: best)
            QUALITY=$(echo "$BODY" | grep -i 'quality:' | sed 's/.*quality:\s*//i' | tr -d ' ' | head -1)
            QUALITY=${QUALITY:-best}
            # Extract subtitles (default: none)
            SUBS=$(echo "$BODY" | grep -i 'subs:' | sed 's/.*subs:\s*//i' | tr -d ' ' | head -1)
            SUBS=${SUBS:-none}
            # Extract password (default: empty)
            PASSWORD=$(echo "$BODY" | grep -i 'password:' | sed 's/.*password:\s*//i' | head -1)
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "quality=$QUALITY" >> $GITHUB_OUTPUT
          echo "subs=$SUBS" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "URL: $URL, Quality: $QUALITY, Subs: $SUBS, Password: ${PASSWORD:+set}"

      - name: Download YouTube video(s) with multiple cookies and soft subtitles
        run: |
          mkdir -p downloads
          cd downloads

          URL="${{ steps.params.outputs.url }}"
          QUALITY="${{ steps.params.outputs.quality }}"
          SUBS="${{ steps.params.outputs.subs }}"
          COOKIE_COUNT="${{ env.COOKIE_COUNT }}"

          # ===== 1. Extract video URLs (handles playlists) =====
          echo "Extracting video URLs from: $URL"
          yt-dlp --flat-playlist --dump-json "$URL" > playlist_info.json

          if jq -e '.entries' playlist_info.json > /dev/null; then
            # It's a playlist
            jq -r '.entries[].url' playlist_info.json > video_urls.txt
            PLAYLIST_TITLE=$(jq -r '.playlist_title' playlist_info.json)
            echo "Playlist detected: $PLAYLIST_TITLE"
          else
            # Single video
            echo "$URL" > video_urls.txt
            PLAYLIST_TITLE=$(jq -r '.title' playlist_info.json)
            echo "Single video: $PLAYLIST_TITLE"
          fi

          mapfile -t VIDEO_URLS < video_urls.txt
          TOTAL_VIDEOS=${#VIDEO_URLS[@]}
          echo "Total videos to download: $TOTAL_VIDEOS"

          # Save playlist title for email
          echo "PLAYLIST_TITLE=$PLAYLIST_TITLE" >> $GITHUB_ENV

          # ===== 2. Load cookies from environment =====
          echo "Loading cookies from secrets..."
          for i in $(seq 1 $COOKIE_COUNT); do
            COOKIE_VAR="YOUTUBE_COOKIE_$i"
            COOKIE_VALUE="${!COOKIE_VAR}"
            if [ -n "$COOKIE_VALUE" ]; then
              echo "$COOKIE_VALUE" > "cookie_$i.txt"
              echo "✅ Loaded cookie $i"
            else
              echo "⚠️ Secret $COOKIE_VAR is empty or not set"
            fi
          done

          COOKIE_LOADED=$(ls cookie_*.txt 2>/dev/null | wc -l)
          if [ "$COOKIE_LOADED" -eq 0 ]; then
            echo "❌ No cookies loaded! Please set at least one YOUTUBE_COOKIE_N secret."
            exit 1
          fi
          echo "Loaded $COOKIE_LOADED cookie files."

          # ===== 3. Build base yt-dlp command =====
          BASE_CMD="yt-dlp --restrict-filenames -o \"%(title)s.%(ext)s\""

          # Quality selection
          if [ "$QUALITY" == "audio-only" ]; then
            BASE_CMD="$BASE_CMD -x --audio-format mp3 --audio-quality 0"
            FORMAT_EXT="mp3"
          else
            case "$QUALITY" in
              "1080p") FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
              "720p")  FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
              "480p")  FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
              "360p")  FORMAT="bestvideo[height<=360]+bestaudio/best[height<=360]" ;;
              *)       FORMAT="bestvideo+bestaudio" ;;
            esac
            BASE_CMD="$BASE_CMD -f \"$FORMAT\" --merge-output-format mp4"
            FORMAT_EXT="mp4"

            # Subtitles - Soft subs (separate files, not embedded)
            case "$SUBS" in
              "fa")
                BASE_CMD="$BASE_CMD --write-subs --sub-langs fa --skip-download"
                ;;
              "en")
                BASE_CMD="$BASE_CMD --write-subs --sub-langs en --skip-download"
                ;;
              "both")
                BASE_CMD="$BASE_CMD --write-subs --sub-langs fa,en --skip-download"
                ;;
              *)
                # No subtitles
                ;;
            esac
          fi

          # ===== 4. Download each video with rotating cookie =====
          COOKIE_INDEX=0
          SUCCESS_COUNT=0
          FAIL_COUNT=0

          for VIDEO_URL in "${VIDEO_URLS[@]}"; do
            # Select cookie (round-robin)
            COOKIE_NUM=$(( (COOKIE_INDEX % COOKIE_LOADED) + 1 ))
            COOKIE_FILE="cookie_$COOKIE_NUM.txt"
            COOKIE_INDEX=$((COOKIE_INDEX + 1))

            echo "=========================================="
            echo "Downloading video $COOKIE_INDEX/$TOTAL_VIDEOS using cookie $COOKIE_NUM"
            echo "URL: $VIDEO_URL"

            # Build full command for this video
            CMD="$BASE_CMD --cookies \"$COOKIE_FILE\" \"$VIDEO_URL\""

            echo "Running: $CMD"
            eval $CMD

            if [ $? -eq 0 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              echo "✅ Download successful"
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
              echo "❌ Download failed for $VIDEO_URL"
            fi

            echo "=========================================="
          done

          echo "Download summary: $SUCCESS_COUNT succeeded, $FAIL_COUNT failed"

          # ===== 5. Count videos for email =====
          VIDEO_COUNT=$TOTAL_VIDEOS
          echo "VIDEO_COUNT=$VIDEO_COUNT" >> $GITHUB_ENV
          echo "FORMAT_EXT=$FORMAT_EXT" >> $GITHUB_ENV
          echo "SUBTITLES_ENABLED=$SUBS" >> $GITHUB_ENV

          # Clean up cookie files
          rm -f cookie_*.txt playlist_info.json video_urls.txt

          echo "Download phase completed."

      - name: Split large files into parts (max ${{ env.MAX_PART_SIZE_MB }} MB each) with optional password
        run: |
          cd downloads
          PASSWORD="${{ steps.params.outputs.password }}"
          EXT="${{ env.FORMAT_EXT }}"
          SUBS="${{ steps.params.outputs.subs }}"

          # Find all video/audio files
          for file in *.$EXT; do
            if [ -f "$file" ]; then
              BASENAME="${file%.*}"
              echo "Processing: $file"

              # Check if there are subtitle files for this video
              SUB_FILES=""
              if [ "$SUBS" != "none" ] && [ "$EXT" != "mp3" ]; then
                # Find subtitle files with same basename
                for sub_ext in srt vtt; do
                  if [ -f "${BASENAME}.${sub_ext}" ]; then
                    SUB_FILES="$SUB_FILES ${BASENAME}.${sub_ext}"
                  fi
                  # Also check for language-specific subs (e.g., .fa.srt, .en.vtt)
                  for lang in fa en; do
                    if [ -f "${BASENAME}.${lang}.${sub_ext}" ]; then
                      SUB_FILES="$SUB_FILES ${BASENAME}.${lang}.${sub_ext}"
                    fi
                  done
                done
              fi

              # Calculate size of all files to be archived
              SIZE_MB=$(du -m "$file" $SUB_FILES 2>/dev/null | awk '{sum+=$1} END {print sum}')
              SIZE_MB=${SIZE_MB:-0}

              if [ $SIZE_MB -gt ${{ env.MAX_PART_SIZE_MB }} ]; then
                echo "File(s) exceed size limit, splitting..."
                if [ -n "$PASSWORD" ]; then
                  7z a -v${{ env.MAX_PART_SIZE_MB }}m -p"$PASSWORD" "${BASENAME}.7z" "$file" $SUB_FILES
                else
                  7z a -v${{ env.MAX_PART_SIZE_MB }}m "${BASENAME}.7z" "$file" $SUB_FILES
                fi
                rm -f "$file" $SUB_FILES
              else
                echo "File(s) are within limit, compressing with 7z..."
                if [ -n "$PASSWORD" ]; then
                  7z a -p"$PASSWORD" "${BASENAME}.7z" "$file" $SUB_FILES
                else
                  7z a "${BASENAME}.7z" "$file" $SUB_FILES
                fi
                rm -f "$file" $SUB_FILES
              fi
            fi
          done

          # Clean up any remaining subtitle files (just in case)
          rm -f *.srt *.vtt

      - name: Upload each part to Ufile.io and collect links
        id: upload
        run: |
          cd downloads
          > upload_info.txt
          TOTAL_UPLOADED=0

          for archive in *.7z*; do
            if [ -f "$archive" ]; then
              echo "Uploading $archive ..."
              RESPONSE=$(curl -s -F "file=@$archive" ${{ env.UFILE_API }})
              LINK=$(echo "$RESPONSE" | jq -r '.data.url // empty')
              if [ -n "$LINK" ]; then
                SIZE=$(du -h "$archive" | cut -f1)
                echo "$archive (Size: $SIZE): $LINK" >> upload_info.txt
                echo "✅ Uploaded: $LINK"
                TOTAL_UPLOADED=$((TOTAL_UPLOADED + 1))
              else
                echo "❌ Failed to upload $archive"
                echo "Server response: $RESPONSE"
              fi
            fi
          done

          echo "TOTAL_UPLOADED=$TOTAL_UPLOADED" >> $GITHUB_ENV
          cat upload_info.txt

      - name: Prepare email body with full details
        id: email_body
        run: |
          cd downloads
          PLAYLIST_TITLE="${{ env.PLAYLIST_TITLE }}"
          VIDEO_COUNT="${{ env.VIDEO_COUNT }}"
          TOTAL_PARTS=$(wc -l < upload_info.txt)
          PASSWORD="${{ steps.params.outputs.password }}"
          QUALITY="${{ steps.params.outputs.quality }}"
          SUBS="${{ steps.params.outputs.subs }}"
          FORMAT_EXT="${{ env.FORMAT_EXT }}"
          TOTAL_UPLOADED="${{ env.TOTAL_UPLOADED }}"

          BODY="Hello,\n\n"
          BODY+="Your YouTube download has been completed successfully.\n"
          BODY+="--------------------------------------------------\n"
          BODY+="📌 Playlist / Video Title: $PLAYLIST_TITLE\n"
          BODY+="📂 Number of videos: $VIDEO_COUNT\n"
          BODY+="📦 Total parts uploaded: $TOTAL_PARTS\n"
          if [ "$QUALITY" == "audio-only" ]; then
            BODY+="🎵 Format: Audio Only (MP3)\n"
          else
            BODY+="🎬 Quality: $QUALITY\n"
            if [ "$SUBS" != "none" ]; then
              BODY+="🔤 Subtitles: $SUBS (Soft subs - separate files included in archives)\n"
            else
              BODY+="🔤 Subtitles: None\n"
            fi
          fi
          if [ -n "$PASSWORD" ]; then
            BODY+="🔒 Password: $PASSWORD (required to extract the archives)\n"
          else
            BODY+="🔓 No password (archives are not encrypted)\n"
          fi
          BODY+="--------------------------------------------------\n\n"
          BODY+="🔗 Download links (each line is a separate file/part):\n\n"
          while IFS= read -r line; do
            BODY+="$line\n"
          done < upload_info.txt
          BODY+="\n⏳ These links are valid for 30 days (Ufile.io).\n"
          BODY+="💡 To extract: If you have multiple parts (e.g., .7z.001, .7z.002), use:\n"
          BODY+="   7z x file.7z.001 -pPASSWORD (if password set)\n"
          if [ "$SUBS" != "none" ] && [ "$QUALITY" != "audio-only" ]; then
            BODY+="📝 Subtitle files are included as separate .srt or .vtt files inside the archive.\n"
          fi
          BODY+="\nRegards,\nYouTube Downloader Bot"

          echo -e "$BODY" > email_body.txt
          cat email_body.txt

      - name: Send email with download links
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '✅ YouTube Download: ${{ env.PLAYLIST_TITLE }}'
          to: ${{ env.RECIPIENT_EMAIL }}
          from: YouTube Downloader
          body_file: downloads/email_body.txt

      - name: Clean up local files
        run: rm -rf downloads

      - name: Close the issue (if triggered by issue)
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            ✅ Download and upload completed successfully!
            
            📌 **Playlist/Video:** ${{ env.PLAYLIST_TITLE }}
            📂 **Number of videos:** ${{ env.VIDEO_COUNT }}
            📦 **Parts uploaded:** ${{ env.TOTAL_UPLOADED }}
            
            All download links have been sent to your email address.
            
            🔗 Check your email for the download links.
